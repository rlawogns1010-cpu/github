<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>도부일일호프 | 09.18 18:30 땡초</title>
<meta name="robots" content="noindex">
<style>
  :root{ --bg:#120d08; --fg:#f2f4f8; --dim:#9aa3b2; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}

  header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:linear-gradient(180deg,rgba(18,13,8,.92),rgba(18,13,8,0))}
  header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.2px}
  #counter{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}

  /* 가로 스와이프 슬라이드 */
  #track{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
  #track::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:0}
  .slide img{width:100%;height:100%;object-fit:contain;display:block}

  footer{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(0deg,rgba(18,13,8,.92),rgba(18,13,8,0))}
  #dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .dot{width:6px;height:6px;border-radius:50%;background:#3a4150;transition:background .2s,transform .2s}
  .dot.on{background:#f2f4f8;transform:scale(1.3)}

  #empty{display:none;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;color:var(--dim);font-size:14px;line-height:1.7}
</style>
</head>
<body>
<header>
  <h1>도부일일호프</h1>
  <span id="counter"></span>
</header>

<div id="track"></div>

<div id="empty">
  표시할 이미지가 없습니다.<br>
  <code>gallery/images/</code> 폴더에 이미지를 넣고<br>
  <code>gallery/images.json</code>에 파일명을 추가하세요.
</div>

<footer>
  <div id="dots"></div>
</footer>

<script>
(async function () {
  const track = document.getElementById('track');
  const dots = document.getElementById('dots');
  const counter = document.getElementById('counter');

  let items = [];
  try {
    const res = await fetch('images.json?v=' + Date.now());
    if (res.ok) items = await res.json();
  } catch (e) {}

  if (!Array.isArray(items) || items.length === 0) {
    track.style.display = 'none';
    document.querySelector('footer').style.display = 'none';
    document.getElementById('empty').style.display = 'flex';
    return;
  }

  items.forEach(function (it, i) {
    const src = typeof it === 'string' ? it : it.src;
    const alt = typeof it === 'string' ? '' : (it.caption || '');
    const slide = document.createElement('div');
    slide.className = 'slide';
    const img = document.createElement('img');
    img.src = 'images/' + src;
    img.alt = alt;
    img.loading = i < 2 ? 'eager' : 'lazy';
    img.decoding = 'async';
    slide.appendChild(img);
    track.appendChild(slide);

    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' on' : '');
    dots.appendChild(dot);
  });

  function render(i) {
    counter.textContent = (i + 1) + ' / ' + items.length;
    Array.prototype.forEach.call(dots.children, function (d, j) {
      d.classList.toggle('on', j === i);
    });
  }
  render(0);

  let raf = 0;
  track.addEventListener('scroll', function () {
    if (raf) return;
    raf = requestAnimationFrame(function () {
      raf = 0;
      render(Math.round(track.scrollLeft / track.clientWidth));
    });
  }, { passive: true });
})();
</script>
</body>
</html>
